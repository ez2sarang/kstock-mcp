name: Publish to PyPI

# Trusted Publishing (OIDC): no PyPI token or repository secret is used.
# One-time setup on PyPI (Account > Publishing > "Add a new pending publisher"):
#   PyPI project name: kstock-mcp
#   Owner: ez2sarang   Repository: kstock-mcp
#   Workflow: publish.yml   Environment: pypi

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
          enable-cache: false

      - name: Verify release tag matches pyproject version
        run: |
          version="$(uv version --short --frozen)"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Release tag '${GITHUB_REF_NAME}' does not match pyproject version 'v${version}'." >&2
            exit 1
          fi

      - name: Run tests
        run: uv run --locked pytest

      - name: Build sdist and wheel
        run: uv build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/kstock-mcp
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
